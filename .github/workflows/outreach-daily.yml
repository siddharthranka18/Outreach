name: Outreach daily discovery

on:
  workflow_dispatch:
    inputs:
      enquiries_only:
        description: Send only email enquiry cards
        type: boolean
        default: false
  schedule:
    - cron: '45 3 * * *' # 09:15 IST
    - cron: '5 4 * * *' # 09:35 IST backup
    - cron: '27 4 * * *' # 09:57 IST backup
    - cron: '11 5 * * *' # 10:41 IST backup
    - cron: '45 12 * * *' # 18:15 IST
    - cron: '5 13 * * *' # 18:35 IST backup
    - cron: '27 13 * * *' # 18:57 IST backup
    - cron: '11 14 * * *' # 19:41 IST backup

permissions:
  contents: read

concurrency:
  group: outreach-daily
  cancel-in-progress: false

jobs:
  discover:
    if: vars.OUTREACH_HOSTED_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: startup-outreach-agent
    steps:
      - name: Check digest delivery window
        id: slot
        if: github.event_name == 'schedule'
        env:
          DIGEST_SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$DIGEST_SCHEDULE" in
            '45 3 * * *'|'5 4 * * *'|'27 4 * * *'|'11 5 * * *') first=0915; last=1115 ;;
            '45 12 * * *'|'5 13 * * *'|'27 13 * * *'|'11 14 * * *') first=1815; last=2015 ;;
            *) echo "::error::Unrecognized digest schedule."; exit 1 ;;
          esac
          read -r day now < <(TZ=Asia/Kolkata date '+%Y%m%d %H%M')
          if [[ "$now" < "$first" || "$now" > "$last" ]]; then
            echo "::warning::Skipped delayed digest at $now IST. Delivery window: $first-$last IST."
            exit 0
          fi
          echo "id=${day}${first}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: github.event_name != 'schedule' || steps.slot.outputs.id != ''
      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.slot.outputs.id != ''
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
        if: github.event_name != 'schedule' || steps.slot.outputs.id != ''
      - run: python -m alembic upgrade head
        if: github.event_name != 'schedule' || steps.slot.outputs.id != ''
      - name: Refresh funding and portfolio leads
        if: github.event_name != 'schedule' || steps.slot.outputs.id != ''
        continue-on-error: true
        run: |
          python run.py --funding-leads > "$RUNNER_TEMP/outreach-leads.txt"
          if [ "$?" -ne 0 ]; then exit 1; fi
          printf '## Startup leads to review\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/outreach-leads.txt" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Discover and post Telegram digest
        if: github.event_name != 'schedule' || steps.slot.outputs.id != ''
        run: |
          if [[ "$ENQUIRIES_ONLY" == true ]]; then
            python run.py --hosted-daily --hosted-enquiries-only
          else
            python run.py --hosted-daily
          fi
        env:
          OUTREACH_DELIVERY_SLOT: ${{ steps.slot.outputs.id }}
          ENQUIRIES_ONLY: ${{ inputs.enquiries_only }}
          OUTREACH_WEB_APP_URL: ${{ secrets.OUTREACH_WEB_APP_URL }}
          OUTREACH_SYNC_SECRET: ${{ secrets.OUTREACH_SYNC_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
