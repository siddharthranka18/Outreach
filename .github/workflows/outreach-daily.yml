name: Outreach daily discovery

on:
  workflow_dispatch:
    inputs:
      enquiries_only:
        description: Send only email enquiry cards
        type: boolean
        default: false
  schedule:
    - cron: '45 3 * * *' # 09:15 IST
    - cron: '5 4 * * *' # 09:35 IST backup
    - cron: '45 12 * * *' # 18:15 IST
    - cron: '5 13 * * *' # 18:35 IST backup

permissions:
  contents: read

concurrency:
  group: outreach-daily
  cancel-in-progress: false

jobs:
  discover:
    if: vars.OUTREACH_HOSTED_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: startup-outreach-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - name: Refresh funding and portfolio leads
        continue-on-error: true
        run: |
          python run.py --funding-leads > "$RUNNER_TEMP/outreach-leads.txt"
          if [ "$?" -ne 0 ]; then exit 1; fi
          printf '## Startup leads to review\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/outreach-leads.txt" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Discover and post Telegram digest
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            case "$DIGEST_SCHEDULE" in
              '45 3 * * *'|'5 4 * * *') first=0915; last=1115 ;;
              '45 12 * * *'|'5 13 * * *') first=1815; last=2015 ;;
              *) echo "Unrecognized digest schedule."; exit 1 ;;
            esac
            now=$(TZ=Asia/Kolkata date +%H%M)
            if [[ "$now" < "$first" || "$now" > "$last" ]]; then
              echo "Skipped delayed digest. Current IST time: $now. Delivery run window: $first-$last."
              exit 0
            fi
            export OUTREACH_DELIVERY_SLOT="$(TZ=Asia/Kolkata date +%Y%m%d)${first}"
          fi
          if [[ "$ENQUIRIES_ONLY" == true ]]; then
            python run.py --hosted-daily --hosted-enquiries-only
          else
            python run.py --hosted-daily
          fi
        env:
          DIGEST_SCHEDULE: ${{ github.event.schedule }}
          ENQUIRIES_ONLY: ${{ inputs.enquiries_only }}
          OUTREACH_WEB_APP_URL: ${{ secrets.OUTREACH_WEB_APP_URL }}
          OUTREACH_SYNC_SECRET: ${{ secrets.OUTREACH_SYNC_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
