name: Outreach daily discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '45 3,12 * * *' # 9:15 AM and 6:15 PM IST

permissions:
  contents: read

concurrency:
  group: outreach-daily
  cancel-in-progress: false

jobs:
  discover:
    if: vars.OUTREACH_HOSTED_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: startup-outreach-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - name: Refresh funding and portfolio leads
        continue-on-error: true
        run: |
          python run.py --funding-leads > "$RUNNER_TEMP/outreach-leads.txt"
          if [ "$?" -ne 0 ]; then exit 1; fi
          printf '## Startup leads to review\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/outreach-leads.txt" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - run: python run.py --hosted-daily
        env:
          OUTREACH_WEB_APP_URL: ${{ secrets.OUTREACH_WEB_APP_URL }}
          OUTREACH_SYNC_SECRET: ${{ secrets.OUTREACH_SYNC_SECRET }}
