name: Outreach daily discovery

on:
  workflow_dispatch:
    inputs:
      enquiries_only:
        description: Send only email enquiry cards
        type: boolean
        default: false
      validate_only:
        description: Check runner setup without sending a Telegram digest
        type: boolean
        default: false
      scheduled_dispatch:
        description: Use the active IST delivery window
        type: boolean
        default: false
  # Oracle systemd owns the schedule. Keep GitHub manual-only to avoid duplicate runs.

permissions:
  contents: read

concurrency:
  group: outreach-daily
  cancel-in-progress: false

jobs:
  discover:
    if: vars.OUTREACH_HOSTED_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: startup-outreach-agent
    steps:
      - name: Check digest delivery window
        id: slot
        if: github.event_name == 'schedule' || inputs.scheduled_dispatch || inputs.validate_only
        working-directory: ${{ github.workspace }}
        run: |
          read -r day now < <(TZ=Asia/Kolkata date '+%Y%m%d %H%M')
          if [[ "$now" > 0914 && "$now" < 1116 ]]; then
            first=0915
          elif [[ "$now" > 1814 && "$now" < 2016 ]]; then
            first=1815
          else
            echo "::notice::No digest due at $now IST. Windows: 0915-1115 and 1815-2015 IST."
            exit 0
          fi
          echo "id=${day}${first}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.slot.outputs.id != '' || (github.event_name != 'schedule' && !inputs.scheduled_dispatch)
      - uses: actions/setup-python@v5
        if: steps.slot.outputs.id != '' || (github.event_name != 'schedule' && !inputs.scheduled_dispatch)
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
        if: steps.slot.outputs.id != '' || (github.event_name != 'schedule' && !inputs.scheduled_dispatch)
      - run: python -m alembic upgrade head
        if: steps.slot.outputs.id != '' || (github.event_name != 'schedule' && !inputs.scheduled_dispatch)
      - name: Refresh funding and portfolio leads
        if: "!inputs.validate_only && (steps.slot.outputs.id != '' || (github.event_name != 'schedule' && !inputs.scheduled_dispatch))"
        continue-on-error: true
        run: |
          python run.py --funding-leads > "$RUNNER_TEMP/outreach-leads.txt"
          if [ "$?" -ne 0 ]; then exit 1; fi
          printf '## Startup leads to review\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/outreach-leads.txt" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Discover and post Telegram digest
        if: "!inputs.validate_only && (steps.slot.outputs.id != '' || (github.event_name != 'schedule' && !inputs.scheduled_dispatch))"
        run: |
          if [[ "$ENQUIRIES_ONLY" == true ]]; then
            python run.py --hosted-daily --hosted-enquiries-only
          else
            python run.py --hosted-daily
          fi
        env:
          OUTREACH_DELIVERY_SLOT: ${{ steps.slot.outputs.id }}
          ENQUIRIES_ONLY: ${{ inputs.enquiries_only }}
          OUTREACH_WEB_APP_URL: ${{ secrets.OUTREACH_WEB_APP_URL }}
          OUTREACH_SYNC_SECRET: ${{ secrets.OUTREACH_SYNC_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
