version: "1.0"
sources:
  - name: "reviewed_careers"
    display_name: "Reviewed Startup Careers"
    type: "employer_careers"
    enabled: true
    description: "Technical internships on LivingAI and Curvvtech's official careers pages."

  - name: "venomics_careers"
    display_name: "Venomics AI Careers"
    type: "employer_careers"
    url: "https://venomics.ai/careers.html"
    enabled: true
    description: "Official internship listing for a size-reviewed employer found through funding research."

  - name: "himalayas"
    display_name: "Himalayas"
    type: "public_jobs_api"
    enabled: true
    description: "Remote technical internships open to India from employers with reviewed domains."

  - name: "hasjob"
    display_name: "Hasjob"
    type: "atom_feed"
    url: "https://hasjob.co/feed"
    enabled: true
    description: "Technical early-career roles from the official Hasjob feed."

  - name: "andhra_startup_map"
    display_name: "Andhra Startup Map Fresher Jobs"
    type: "verified_fresher_board"
    url: "https://www.andhrastartupmap.in/jobs"
    enabled: true
    description: "Employer-verified India fresher and internship roles with direct application links."

  - name: "y_combinator"
    display_name: "Y Combinator"
    type: "directory"
    url: "https://www.ycombinator.com/companies"
    enabled: true
    description: "Y Combinator public company directory and hiring profiles."

  - name: "top_startups"
    display_name: "TopStartups.io"
    type: "curated_list"
    url: "https://topstartups.io/jobs/"
    enabled: true
    description: "Curated startup database filtered for early-stage and funded companies."

  - name: "wellfound_india"
    display_name: "Wellfound India"
    type: "startup_job_board"
    url: "https://wellfound.com/location/india"
    enabled: true
    description: "Public India startup listings with company-size and experience metadata."

  - name: "company_career_sites"
    display_name: "Direct Career Pages & ATS"
    type: "direct_ats"
    enabled: true
    description: "Public employer ATS boards with reviewed company-size evidence."
